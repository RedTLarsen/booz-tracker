apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: alcohol-tracker-data
  namespace: alcohol-tracker
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alcohol-tracker
  namespace: alcohol-tracker
  labels:
    app.kubernetes.io/name: alcohol-tracker
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: alcohol-tracker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: alcohol-tracker
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: alcohol-tracker
          image: ghcr.io/redtlarsen/booz-tracker:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: DATABASE_PATH
              value: /data/alcohol-tracker.sqlite3
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: alcohol-tracker-secret
                  key: secret-key
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: alcohol-tracker-data
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: alcohol-tracker
  namespace: alcohol-tracker
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: alcohol-tracker
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
